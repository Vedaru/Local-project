# ============================================================
# Project Local Unified Configuration
# ============================================================
# 本文件是项目运行配置的唯一真相来源（Single Source of Truth）。
# 兼容说明：环境变量仍可用于覆盖，但默认都从本文件读取。

meta:
  config_version: 2
  unified_config: true

# GUI 启动前自检（main.py）；环境变量 SKIP_STARTUP_SELF_CHECK=1 可跳过
startup:
  self_check_enabled: true
  strict_mode: true
  abort_on_critical_failure: true
  run_full_test_suite: false
  run_smoke_test_suite: true  # 全部 tests/ 绿后再开 run_full_test_suite
  test_suite_timeout_sec: 300
  timeout_sec: 5.0

# --------------------- 应用核心配置 ---------------------
api:
  ark_api_key: "sk-330189069eaf41f989fef22f330627d5"
  ark_base_url: "https://api.deepseek.com"
  model_name: "deepseek-v4-pro"
  embedding_model_name: ""
  sovits_url: "http://127.0.0.1:9880"

audio:
  ref_audio_path: "assets/audio_ref/大家好，我是虚拟歌手洛天依.wav"
  prompt_text: "大家好，我是虚拟歌手洛天依，欢迎来到我的十周年生日会直播。"
  sample_rate: 32000

memory:
  data_dir: "data/memoripy"
  collection_name: "seeka_memory"
  n_results: 8

logging:
  log_dir: "data/logs"

thresholds:
  max_entity_count: 100
  memory_cleanup_days: 7

controller:
  enabled: true
  failsafe: true
  app_whitelist:
    notepad: "C:\\Windows\\System32\\notepad.exe"
    calc: "C:\\Windows\\System32\\calc.exe"
    edge: "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"
    qq: "C:\\Program Files\\Tencent\\QQNT\\QQ.exe"

ear:
  enabled: false
  model_size: "base"

agent:
  max_steps: 100
  task_timeout_seconds: 300.0

avatar:
  width: 400
  height: 600
  x: 100
  y: 100

# --------------------- 微服务与行为调优 ---------------------
services:
  gateway_port: 18080
  orchestrator_port: 18081
  memory_service_port: 18082
  agent_service_port: 18083
  voice_service_port: 18084
  orchestrator_url: "http://localhost:18081"
  memory_service_url: "http://localhost:18082"
  agent_service_url: "http://localhost:18083"
  voice_service_url: "http://localhost:18084"

orchestrator:
  llm_executor_workers: 4
  memory_timeout_sec: 3.0
  memory_retrieve_timeout_sec: 2.5
  memory_store_timeout_sec: 1.0
  memory_batch_timeout_sec: 10.0
  agent_timeout_sec: 180.0
  voice_timeout_sec: 25.0
  max_requests_per_second: 12.0
  burst_size: 24
  voice_async_batch_enabled: true
  voice_batch_max_size: 8
  voice_batch_collect_window_ms: 3
  voice_batch_result_wait_sec: 2.0
  voice_batch_congested_queue_size: 12
  voice_batch_result_wait_sec_congested: 1.0
  voice_hit_priority_direct_enabled: true
  voice_hit_priority_direct_timeout_sec: 5.0
  voice_chat_sync_wait_sec: 25.0
  circuit_fail_threshold: 3
  circuit_cooldown_sec: 15.0
  pending_memory_queue_size: 24

voice:
  connect_timeout_sec: 3
  read_timeout_sec: 30
  streaming_mode: 3
  parallel_infer: false
  min_chunk_length: 8
  overlap_length: 1
  text_split_method: "cut1"
  buffered_fallback_enabled: true
  system_tts_fallback_enabled: true
  cpp_accel_lib: ""
  wav_output_dir: "data/temp"
  wav_cleanup_enabled: true
  wav_cleanup_interval_sec: 60
  wav_ttl_sec: 300
  delete_wav_after_playback: true

expression:
  auto_reset_sec: 8.0  # 表情保持时间（秒），FACS 模式下需要更长
  min_timer_gap_ms: 120
  timeline_play_motion: false
  min_segment_sec: 0.30
  min_hold_sec: 0.55
  switch_margin: 0.10
  continuity_bias: 0.12
  smooth_window_sec: 0.55
  neutral_tail_sec: 0.26

gateway:
  chat_timeout_sec: 45
  api_key: ""
  # 与 uvicorn --host 保持一致；非回环监听时必须配置 api_key（或环境变量 GATEWAY_API_KEY）
  bind_host: "127.0.0.1"

# 高危工具开关（见 docs/SECURITY.md）；可用环境变量 SECURITY_TOOL_*_ENABLED 覆盖
security:
  tools:
    browser_automation_enabled: true
    python_execution_enabled: true
    shell_execution_enabled: true
    file_editor_enabled: true
    mcp_enabled: true

client:
  user_id: "local-gui"
  request_timeout_sec: 30

network:
  http_client:
    pool_max_connections: 200
    pool_max_keepalive: 50

# --------------------- 运行时策略配置 ---------------------
runtime:
  python:
    min_version: "3.10"
    max_version_exclusive: "3.12"
    strict: false

memory_service:
  wal_path: ""
  batch_disable_fact_extraction: true
  batch_deferred_persist: true

# --------------------- OpenManus 派生配置 ---------------------
# 说明：modules/agent/core.py 会将本节渲染为 modules/openmanus/config/config.toml
#      该 toml 仅作为运行时派生文件，不再作为手动维护源。
openmanus:
  llm:
    model: "deepseek-v4-pro"
    base_url: "https://api.deepseek.com"
    api_key: "sk-330189069eaf41f989fef22f330627d5"
    max_tokens: 8192
    temperature: 0.0
    api_type: ""
    api_version: ""
  search:
    engine: "DuckDuckGo"
    fallback_engines: ["Bing", "Baidu"]
    lang: "zh"
    country: "cn"
  browser:
    headless: false
    disable_security: true
  mcp:
    server_reference: "app.mcp.server"
