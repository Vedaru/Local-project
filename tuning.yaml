# ============================================================
# Project Local — Behavior Tuning Configuration
# ============================================================
# 所有微服务行为调优参数的单一真相来源。
#
# 优先级（从低到高）:
#   1. 本文件默认值
#   2. 环境变量覆盖（同名环境变量会覆盖本文件的值）
#
# 使用方式: 模块通过 TuningConfig 访问，不再直接 os.getenv()
# ============================================================

# ─────────────────────────────────────────────
# 微服务端口与地址
# ─────────────────────────────────────────────
services:
  gateway_port: 18080
  orchestrator_port: 18081
  memory_service_port: 18082
  agent_service_port: 18083
  voice_service_port: 18084
  orchestrator_url: "http://localhost:18081"
  memory_service_url: "http://localhost:18082"
  agent_service_url: "http://localhost:18083"
  voice_service_url: "http://localhost:18084"

# ─────────────────────────────────────────────
# 编排器 (Orchestrator) 行为调优
# ─────────────────────────────────────────────
orchestrator:
  # LLM 线程池
  llm_executor_workers: 4

  # 超时设置 (秒)
  memory_timeout_sec: 8.0
  memory_retrieve_timeout_sec: 8.0
  memory_store_timeout_sec: 1.8
  memory_batch_timeout_sec: 10.0          # 自动计算: max(retrieve + 0.8)
  agent_timeout_sec: 180.0
  voice_timeout_sec: 60.0

  # TTS 批处理调度
  voice_async_batch_enabled: true
  voice_batch_max_size: 8                 # 每批发送的最大任务数
  voice_batch_collect_window_ms: 8        # 收集窗口(毫秒)
  voice_batch_result_wait_sec: 1.2        # 正常等待超时
  voice_batch_congested_queue_size: 12    # 拥塞阈值
  voice_batch_result_wait_sec_congested: 0.4  # 拥塞时缩短等待
  voice_hit_priority_direct_enabled: true # 队列空时跳过批处理直接调用
  voice_hit_priority_direct_timeout_sec: 8.0  # 直接调用超时

  # 断路器
  circuit_fail_threshold: 3              # 连续失败多少次后熔断
  circuit_cooldown_sec: 30.0             # 冷却时间

  # 内存写入队列
  pending_memory_queue_size: 24           # 每用户最大待写条目数

# ─────────────────────────────────────────────
# 语音 / TTS 管道
# ─────────────────────────────────────────────
voice:
  # HTTP 连接
  connect_timeout_sec: 5
  read_timeout_sec: 30

  # 流式合成参数
  streaming_mode: 3                        # 0=关闭, 2=简单, 3=完整流式
  parallel_infer: false                    # 并行推理分块
  min_chunk_length: 8                      # 最小分块长度
  overlap_length: 1                        # 分块重叠长度
  text_split_method: "cut1"                # 文本切分算法

  # 降级策略
  buffered_fallback_enabled: true          # 流式失败时缓冲模式回退
  system_tts_fallback_enabled: true        # 最终降级到系统TTS

  # C++ 加速后端
  cpp_accel_lib: ""                        # 自定义 C++ 库路径(空=自动检测)

  # WAV 文件管理 (voice_service)
  wav_output_dir: "data/temp"              # WAV 输出目录
  wav_cleanup_enabled: true                # 定期清理临时WAV
  wav_cleanup_interval_sec: 120            # 清理间隔
  wav_ttl_sec: 1800                        # WAV 文件存活时间(30分钟)

# ─────────────────────────────────────────────
# 表情 & Avatar 系统
# ─────────────────────────────────────────────
expression:
  # 时间线调度 (ExpressionOrchestrator)
  auto_reset_sec: 2.4                     # 情绪自动衰减回中性的延迟(秒)
  min_timer_gap_ms: 120                    # 定时器最小间隔(毫秒)
  timeline_play_motion: false              # 表情变化时是否触发动作

  # 加权情感分析 (ExpressionManager / expression.py)
  min_segment_sec: 0.30                   # 最短表情片段时长
  min_hold_sec: 0.55                       # 最短保持时间
  switch_margin: 0.10                      # 切换边距(防抖)
  continuity_bias: 0.12                    # 连续性偏好(越大越不容易切换)
  smooth_window_sec: 0.55                  # 平滑窗口大小
  neutral_tail_sec: 0.26                   # 中性尾部追加时间

# ─────────────────────────────────────────────
# 网关 (Gateway)
# ─────────────────────────────────────────────
gateway:
  chat_timeout_sec: 60                     # 聊天请求总超时(自动取各服务最大值)
  api_key: ""                              # API密钥(空=不鉴权)

# ─────────────────────────────────────────────
# 客户端 (ServiceClient)
# ─────────────────────────────────────────────
client:
  user_id: "local-gui"                    # 默认用户标识
  request_timeout_sec: 30                  # 客户端HTTP超时
