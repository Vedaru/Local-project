[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "local-project"
version = "0.1.0"
description = "AI Desktop Assistant with Avatar - 带虚拟形象的桌面 AI 助手"
# Windows runtime pin: scripts/runtime_version.txt (currently 3.11.9 embeddable)
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Local Project Team"}
]
keywords = ["ai", "assistant", "avatar", "voice", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/Vedaru/Local-project"
Repository = "https://github.com/Vedaru/Local-project"

[tool.poetry]
name = "local-project"
version = "0.1.0"
description = "AI Desktop Assistant with Avatar"
authors = ["Local Project Team"]
packages = [{include = "modules"}]

[tool.poetry.dependencies]
# 版本与 requirements.txt 保持一致（见 docs/DEPENDENCIES.md）
python = ">=3.10,<3.12"

# LLM 与 API
openai = ">=1.58.1,<2"
python-dotenv = ">=1.0.1"
requests = ">=2.32.3"
httpx = {version = "0.28.1", extras = ["http2"]}
h2 = ">=4.0.0"
pyyaml = "6.0"
pydantic = ">=2.10.4,<3"

# 中文分词
jieba = "0.42.1"

# 音频输入
pyaudio = "0.2.14"

# 文档处理
python-pptx = "1.0.2"
python-docx = "1.1.2"
reportlab = "4.2.0"

# 记忆系统
faiss-cpu = "1.7.4"
scikit-learn = "1.3.2"
networkx = "3.2.1"
sentence-transformers = "2.2.2"

# GUI
PyQt6 = "6.6.1"
PyQt6-Qt6 = ">=6.6.0,<6.7"
PyQt6-sip = ">=13.6,<14"
PyQt6-WebEngine = "6.6.0"
qasync = "0.27.1"

# 语音识别 (ASR) — Ear 使用 faster-whisper；不安装 openai-whisper 源码包
faster-whisper = ">=1.1.0,<2"
av = ">=12"
ctranslate2 = ">=4.0,<5"
numpy = "1.24.3"

# 电脑控制
pyautogui = "0.9.54"
pygetwindow = "0.0.9"

# Agent 框架
browser-use = "0.1.40"
playwright = ">=1.49.0"
tenacity = "8.2.3"
structlog = "23.2.0"
loguru = "0.7.2"
tiktoken = ">=0.7,<1"
aiofiles = "23.2.1"
colorama = "0.4.6"
fastapi = ">=0.128.6,<0.136"
starlette = ">=1.0.0,<2.0.0"
uvicorn = { version = ">=0.34.0,<0.37", extras = ["standard"] }
html2text = "2020.1.16"
googlesearch-python = "1.2.3"
baidusearch = "1.0.3"
duckduckgo_search = "3.9.6"
tomli = "2.0.1"
beautifulsoup4 = "4.12.2"

# OCR
pytesseract = "0.3.10"

# 进度条
tqdm = "4.66.1"

# GPT-SoVITS 语音合成（可选，使用 -GptSovits 参数安装）
# 注意: transformers>=4.38 要求 torch>=2.6.0 (CVE-2025-32434)
# transformers = ">=4.38.0"
# huggingface_hub = ">=0.19.0"
# peft = ">=0.7.0"
# pytorch-lightning = ">=2.1.0"
# torchmetrics = ">=1.2.0"
# einops = ">=0.7.0"
# x-transformers = ">=1.27.0"
# librosa = ">=0.10.0"
# soundfile = ">=0.12.0"
# ffmpeg-python = ">=0.2.0"
# onnxruntime = ">=1.16.0"
# pypinyin = ">=0.49.0"
# cn2an = ">=0.5.22"
# nltk = ">=3.8.0"
# matplotlib = ">=3.7.0"

# OpenManus Agent（可选）
# mcp = ">=1.0.0"
# docker = ">=7.0.0"
# boto3 = ">=1.34.0"
# crawl4ai = ">=0.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.3"
pytest-cov = "4.1.0"
pytest-asyncio = "0.21.1"
pytest-mock = "3.12.0"
pytest-xdist = "3.5.0"
black = "23.11.0"
isort = "5.12.0"
ruff = "0.15.16"
mypy = "1.7.1"
pre-commit = "3.6.0"
types-requests = "2.31.0.10"
types-pyyaml = "6.0.12.12"

[tool.poetry.scripts]
local-project = "main:main"

# ============================================================
# Tool Configurations
# ============================================================

[tool.black]
line-length = 120
target-version = ['py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | __pycache__
    | modules/gpt_sovits
    | modules/openmanus
    | runtime
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [
    "modules/gpt_sovits/*",
    "modules/openmanus/*",
    "__pycache__/*",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "modules/gpt_sovits",
    "modules/openmanus",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
]
ignore = [
    "E501",   # line too long (handled by black)
    "E203",   # whitespace before ':'
    "E266",   # too many leading '#' for block comment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
no_implicit_optional = false
exclude = [
    "modules/gpt_sovits",
    "modules/openmanus",
    "modules/memory",
    "tests",
]

[[tool.mypy.overrides]]
module = "microservices.shared.bind_policy"
disallow_untyped_defs = true
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "microservices.shared.http_client"
disallow_untyped_defs = true
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "microservices.shared.types"
disallow_untyped_defs = true
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "microservices.gateway.main"
disallow_untyped_defs = true
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "microservices.orchestrator.main"
disallow_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true


[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--ignore=tests/manual",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
branch = true
source = ["modules", "microservices"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "modules/gpt_sovits/*",
    "modules/openmanus/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
fail_under = 55
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = [
    "tests",
    "modules/gpt_sovits",
    "modules/openmanus",
]
skips = ["B101", "B311"]  # Skip assert and random warnings
