[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "local-project"
version = "0.1.0"
description = "AI Desktop Assistant with Avatar - 带虚拟形象的桌面 AI 助手"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Local Project Team"}
]
keywords = ["ai", "assistant", "avatar", "voice", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/your-org/local-project"
Repository = "https://github.com/your-org/local-project"

[tool.poetry]
name = "local-project"
version = "0.1.0"
description = "AI Desktop Assistant with Avatar"
authors = ["Local Project Team"]
readme = "README.md"
packages = [{include = "modules"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
# Core dependencies
openai = ">=1.0.0"
python-dotenv = ">=1.0.0"
jieba = ">=0.42.1"
pyaudio = ">=0.2.13"
requests = ">=2.31.0"
pyyaml = ">=6.0"
python-pptx = ">=1.0.2"

# Memory system (memoripy)
faiss-cpu = ">=1.7.0"
scikit-learn = ">=1.2.0"
networkx = ">=3.0"
sentence-transformers = ">=2.2.0"
pydantic = ">=2.0.0"

# Avatar module (PyQt6)
PyQt6 = ">=6.4.0"
PyQt6-WebEngine = ">=6.4.0"

# Voice recognition & audio
openai-whisper = ">=20250101"
faster-whisper = ">=0.5.0"
ctranslate2 = ">=4.0"
numpy = ">=1.22.0,<2.3.0"

# Computer control
pyautogui = ">=0.9.53"
pygetwindow = ">=0.0.9"

# Agent / Browser capabilities (OpenManus)
browser-use = ">=0.1.40"
playwright = ">=1.51.0"
tenacity = ">=9.0.0"
structlog = ">=24.0.0"
loguru = ">=0.7.3"
tiktoken = ">=0.9.0"
aiofiles = ">=24.1.0"
colorama = ">=0.4.6"
html2text = ">=2024.2.26"
googlesearch-python = ">=1.3.0"
baidusearch = ">=1.0.3"
duckduckgo_search = ">=7.5.3"
tomli = ">=2.0.0"
httpx = ">=0.27.0"
beautifulsoup4 = ">=4.12.0"

# OCR
pytesseract = ">=0.3.10"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
pytest-asyncio = ">=0.21.0"
pytest-mock = ">=3.12.0"
pytest-xdist = ">=3.5.0"

# Code quality
black = ">=23.0.0"
isort = ">=5.12.0"
ruff = ">=0.1.0"
mypy = ">=1.5.0"

# Pre-commit hooks
pre-commit = ">=3.5.0"

# Type stubs
types-requests = ">=2.31.0"
types-pyyaml = ">=6.0.0"

[tool.poetry.scripts]
local-project = "main:main"

# ============================================================
# Tool Configurations
# ============================================================

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | __pycache__
    | modules/gpt_sovits
    | modules/openmanus
    | runtime
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [
    "modules/gpt_sovits/*",
    "modules/openmanus/*",
    "__pycache__/*",
]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "modules/gpt_sovits",
    "modules/openmanus",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C4",     # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "ARG001", # unused function argument
    "ARG002", # unused method argument
    "UP045",  # use X | None instead of Optional (not supported in Python 3.9)
    "UP037",  # remove quotes from type annotations (can conflict with TYPE_CHECKING)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
exclude = [
    "modules/gpt_sovits",
    "modules/openmanus",
    "modules/memory",
    "tests",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--ignore=tests/temp_click_test.py",
    "--ignore=tests/temp_test_script.py",
    "--ignore=tests/temp_test_script2.py",
    "--ignore=tests/simulate_name_write.py",
    "--ignore=tests/tmp_list.py",
    "--ignore=tests/test_action_executor_manual.py",
    "--ignore=tests/test_open_notebook.py",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["modules"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "modules/gpt_sovits/*",
    "modules/openmanus/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
fail_under = 30
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = [
    "tests",
    "modules/gpt_sovits",
    "modules/openmanus",
]
skips = ["B101", "B311"]  # Skip assert and random warnings
