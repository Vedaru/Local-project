# GitHub Actions CI/CD Pipeline for Local-project
# Runs on push to main/develop and on pull requests

name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # ============================================================
  # Code Quality Checks
  # ============================================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install black isort ruff mypy

      - name: Check code formatting with Black
        run: |
          black --check --diff modules/ tests/ main.py

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff modules/ tests/ main.py

      - name: Lint with Ruff
        run: |
          ruff check modules/ tests/ main.py

      - name: Type check with mypy
        run: |
          mypy modules/ --ignore-missing-imports
        continue-on-error: true  # Don't fail on type errors initially

  # ============================================================
  # Unit Tests
  # ============================================================
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11"]
        exclude:
          # Reduce matrix size for faster CI
          - os: windows-latest
            python-version: "3.9"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel
          # Always install test framework first
          python -m pip install pytest pytest-cov pytest-asyncio pytest-mock
          # Install minimal required deps for tests (must succeed)
          python -m pip install pyyaml python-dotenv requests jieba pydantic networkx openai sentence-transformers scikit-learn faiss-cpu numpy
          # Try to install full requirements (optional deps may fail on some platforms)
          python -m pip install -r requirements.txt || true

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -x --maxfail=1
        env:
          ARK_API_KEY: "test-key"
          MODEL_NAME: "test-model"
          PYTHONUTF8: "1"

  # ============================================================
  # Test Coverage
  # ============================================================
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pytest-asyncio pytest-mock
          python -m pip install pyyaml python-dotenv requests jieba pydantic networkx openai sentence-transformers scikit-learn faiss-cpu numpy
          python -m pip install -r requirements.txt || true

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=modules --cov-report=xml --cov-report=html -v
        env:
          ARK_API_KEY: "test-key"
          MODEL_NAME: "test-model"
          PYTHONUTF8: "1"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
        if: always()

  # ============================================================
  # Security Scan
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Run Bandit security scan
        run: |
          bandit -r modules/ -ll -ii -x tests/
        continue-on-error: true

      - name: Check for vulnerable dependencies
        run: |
          pip-audit --requirement requirements.txt
        continue-on-error: true

  # ============================================================
  # Build Check (ensures package can be built)
  # ============================================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check dist/*
