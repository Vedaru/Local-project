# GitHub Actions CI/CD Pipeline for Local-project
# Runs on push to main/develop and on pull requests

name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  LINT_PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # ============================================================
  # Code Quality Checks
  # ============================================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.LINT_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            black==23.11.0 isort==5.12.0 ruff==0.1.6 mypy==1.7.1 \
            types-requests==2.31.0.10 types-pyyaml==6.0.12.12

      - name: Check code formatting with Black
        run: |
          black --check --diff modules/ tests/ main.py application.py microservices/

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff modules/ tests/ main.py application.py microservices/

      - name: Lint with Ruff
        run: |
          ruff check modules/ tests/ main.py application.py microservices/

      - name: Type check with mypy
        run: |
          python -m mypy modules/ microservices/ main.py application.py

      - name: Syntax check integration modules
        run: |
          python -m py_compile \
            modules/openmanus/app/tool/web_search.py \
            modules/openmanus/app/tool/tool_collection.py \
            modules/gpt_sovits/api_v2.py

      - name: Ruff sanity check integration modules
        run: |
          ruff check --select E9,F63,F7,F82 \
            modules/openmanus/app/tool/web_search.py \
            modules/openmanus/app/tool/tool_collection.py \
            modules/gpt_sovits/api_v2.py

  # ============================================================
  # Unit Tests
  # ============================================================
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]
        exclude: []

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -n auto
        env:
          ARK_API_KEY: "test-key"
          MODEL_NAME: "test-model"
          PYTHONUTF8: "1"

  # ============================================================
  # Dependency Install Check
  # ============================================================
  requirements:
    name: Dependency Install Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.LINT_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install system dependencies for audio libs
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install requirements strictly
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

  # ============================================================
  # Test Coverage
  # ============================================================
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ --cov=modules --cov=microservices --cov-report=xml --cov-report=html --cov-fail-under=55 -v -n auto
        env:
          ARK_API_KEY: "test-key"
          MODEL_NAME: "test-model"
          PYTHONUTF8: "1"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
        if: always()

  # ============================================================
  # Focused Integration Coverage (excluded dirs in baseline coverage)
  # ============================================================
  integration-coverage:
    name: Integration Coverage (OpenManus Tools)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run focused integration coverage
        run: |
          python -m coverage erase
          python -m coverage run --rcfile=coverage.integration.ini -m pytest \
            tests/test_openmanus_web_search_fetcher.py \
            tests/test_openmanus_tool_collection.py \
            -v
          python -m coverage report --rcfile=coverage.integration.ini -m \
            --include="*/modules/openmanus/app/tool/web_search.py,*/modules/openmanus/app/tool/tool_collection.py"
          python -m coverage xml --rcfile=coverage.integration.ini \
            -o coverage-integration.xml \
            --include="*/modules/openmanus/app/tool/web_search.py,*/modules/openmanus/app/tool/tool_collection.py"
        env:
          ARK_API_KEY: "test-key"
          MODEL_NAME: "test-model"
          PYTHONUTF8: "1"

      - name: Upload integration coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-integration
          path: coverage-integration.xml
        if: always()

  # ============================================================
  # Security Scan
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Run Bandit security scan
        run: |
          bandit -r modules/ -ll -ii -x tests/

      - name: Run Bandit targeted scan for integration modules
        run: |
          bandit -q -lll -iii \
            modules/openmanus/app/tool/web_search.py \
            modules/openmanus/app/tool/tool_collection.py \
            modules/gpt_sovits/api_v2.py

      - name: Check for vulnerable dependencies
        run: |
          pip-audit --requirement requirements.txt

  # ============================================================
  # Build Check (ensures package can be built)
  # ============================================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test, requirements, integration-coverage]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check dist/*
