# GitHub Actions CI/CD Pipeline for Local-project
# Runs on push to main/develop and on pull requests

name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

env:
  PYTHON_VERSION: "3.10"

jobs:
  # ============================================================
  # Code Quality Checks
  # ============================================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort ruff mypy

      - name: Check code formatting with Black
        run: |
          black --check --diff modules/ tests/ main.py

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff modules/ tests/ main.py

      - name: Lint with Ruff
        run: |
          ruff check modules/ tests/ main.py

      - name: Type check with mypy
        run: |
          mypy modules/ --ignore-missing-imports
        continue-on-error: true  # Don't fail on type errors initially

  # ============================================================
  # Unit Tests
  # ============================================================
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11"]
        exclude:
          # Reduce matrix size for faster CI
          - os: windows-latest
            python-version: "3.9"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Always install test framework first
          pip install pytest pytest-cov pytest-asyncio pytest-mock
          # Install minimal required deps for tests (must succeed)
          pip install pyyaml python-dotenv requests jieba pydantic networkx openai chromadb sentence-transformers scikit-learn faiss-cpu numpy
          # Try to install full requirements (optional deps may fail on some platforms)
          pip install -r requirements.txt || true

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -x
        env:
          ARK_API_KEY: "test-key"
          MODEL_NAME: "test-model"

  # ============================================================
  # Test Coverage
  # ============================================================
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-mock
          pip install pyyaml python-dotenv requests jieba pydantic networkx openai chromadb sentence-transformers scikit-learn faiss-cpu numpy

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=modules --cov-report=xml --cov-report=html -v
        env:
          ARK_API_KEY: "test-key"
          MODEL_NAME: "test-model"
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
        if: always()

  # ============================================================
  # Security Scan
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit safety pip-audit

      - name: Run Bandit security scan
        run: |
          bandit -r modules/ -ll -ii -x tests/
        continue-on-error: true

      - name: Check for vulnerable dependencies
        run: |
          pip-audit --requirement requirements.txt --ignore-vuln GHSA-xxxx-xxxx-xxxx || true
        continue-on-error: true

  # ============================================================
  # Build Check (ensures package can be built)
  # ============================================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          pip install build twine

      - name: Build package
        run: |
          python -m build
        continue-on-error: true

      - name: Check package
        run: |
          twine check dist/*
        continue-on-error: true
        if: always()
